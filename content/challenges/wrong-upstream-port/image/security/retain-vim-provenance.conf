# Preserve the complete locally rebuilt Vim Tiny package under Debian slim.
path-include /usr/share/doc/vim-tiny
path-include /usr/share/doc/vim-tiny/*
path-include /usr/share/lintian
path-include /usr/share/lintian/overrides
path-include /usr/share/lintian/overrides/vim-tiny
path-include /usr/share/doc/vim-common
path-include /usr/share/doc/vim-common/*
path-include /usr/share/vim
path-include /usr/share/vim/*
path-include /usr/share/vim/*/*
