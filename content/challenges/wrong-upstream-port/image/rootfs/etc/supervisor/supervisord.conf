[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data -c config_file=/etc/postgresql/postgresql.conf
user=postgres
priority=10
autorestart=false
stopsignal=INT
stopwaitsecs=10
stdout_logfile=/var/log/postgresql/postgresql.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true

[program:shop]
command=/usr/local/bin/opsreplay-shop
directory=/opt/shop
user=shop
environment=HOME="/var/lib/shop"
priority=20
autorestart=false
stopasgroup=true
stdout_logfile=/var/log/shop/app.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=false
stopsignal=QUIT
stopwaitsecs=5
stdout_logfile=/var/log/nginx/startup.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
